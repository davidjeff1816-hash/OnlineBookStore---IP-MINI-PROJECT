<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Register - BookNest</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 18px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }

        .container {
            width: 400px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            border: 1px solid #ddd;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #333;
        }

        footer {
            text-align: center;
            color: #666;
            margin-top: 40px;
        }

    </style>

</head>

<body>


<header>

    <div class="logo">
        📚 BookNest
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="books">Books</a>

        <a href="login.html">Login</a>

    </nav>

</header>


<div class="container">

    <div class="form-box">

        <h1>Create Account</h1>

        <form action="register" method="post">

            <label>Name</label>

            <input
                type="text"
                name="name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<footer>

    © 2026 BookNest Online Book Store

</footer>


</body>
</html>
